<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Kota Bintang | Modern Living Superblock & Residential Bekasi</title>
    <meta
      name="description"
      content="Temukan hunian modern mewah dan pusat gaya hidup premium di Grand Kota Bintang Bekasi. Akses langsung 0 km ke Pintu Tol JORR & Becakayu. Hubungi marketing kami hari ini untuk penawaran eksklusif."
    />
    <meta
      name="keywords"
      content="grand kota bintang, superblock bekasi, perumahan bekasi, ruko stellar avenue, cluster marocco, cluster roma, tol jorr, tol becakayu, rumah mewah bekasi, developer perumahan"
    />
    <meta name="author" content="Grand Kota Bintang Developer" />
    <link rel="icon" type="image/webp" href="/assets/favicon.webp" />

    <!-- LCP hero image: fetch before JS so mobile paint is faster -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/assets/cluster_marocco-640.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/assets/cluster_marocco.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <!-- Fonts: self-hosted via @fontsource di styles.css (tanpa rantai fonts.googleapis.com) -->

    <!-- Critical above-the-fold — mencegah FOUC saat CSS bundle di-defer -->
    <style>
      html {
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
        background: #f8f9fa;
        color: #1c2434;
        font-family: system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      #hero {
        position: relative;
        min-height: 650px;
        display: flex;
        align-items: center;
        overflow: hidden;
        padding-top: 5rem;
      }
      @media (max-width: 768px) {
        #hero {
          min-height: 0;
          height: auto;
          padding-bottom: 4rem;
        }
      }
    </style>

    <!-- FontAwesome Icons (Asynchronous non-blocking loading) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      media="print"
      onload="this.media='all'"
    />

    <!-- Leaflet CSS for below-the-fold Interactive Map (Asynchronous non-blocking loading) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <!-- Static LCP layer: paints before React; hidden once app mounts -->
    <div id="hero-lcp-bg" class="hero-lcp-bg" aria-hidden="true">
      <picture>
        <source
          media="(max-width: 767px)"
          srcset="/assets/cluster_marocco-640.webp"
          type="image/webp"
        />
        <source
          media="(max-width: 1024px)"
          srcset="/assets/cluster_marocco-828.webp"
          type="image/webp"
        />
        <img
          src="/assets/cluster_marocco.webp"
          alt=""
          width="1024"
          height="1024"
          fetchpriority="high"
          decoding="sync"
        />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
